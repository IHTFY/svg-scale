<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="color-scheme" content="light dark" />
    <meta name="theme-color" content="#fff7f7" media="(prefers-color-scheme: light)" />
    <meta name="theme-color" content="#17181c" media="(prefers-color-scheme: dark)" />
    <meta
      name="description"
      content="Scale an SVG path directly instead of using transform. Rounds, minifies and optimizes the d attribute, right in your browser."
    />
    <title>SVG Path Scaler</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23ee6e73'/%3E%3Cpath d='M8 24V8h9v4h-5v3h5v4h-5v5z' fill='%23fff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="styles.css" />
    <script defer src="svgpath.js"></script>
    <script defer src="script.js"></script>

    <!-- Google Auto Ads -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7816252471679024"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <header class="site-header">
      <h1>SVG Path Scaler</h1>
      <p class="tagline">
        Scale a path's <code>d</code> directly, no <code>transform</code> needed. Everything runs in your browser.
      </p>
      <a class="gh" href="https://github.com/IHTFY/svg-scale" aria-label="Source on GitHub" title="Source on GitHub">
        <svg id="gh_logo" viewBox="0 0 32 32" width="28" height="28" aria-hidden="true">
          <path d="M16 0C7.2 0 0 7.2 0 16c0 7.1 4.6 13 11 15 .8 .14 1.1-.34 1.1-.76 0-.38-.02-1.6-.02-3-4 .74-5.1-.98-5.4-1.9-.18-.46-.96-1.9-1.6-2.3-.56-.3-1.4-1-.02-1.1 1.3-.02 2.2 1.2 2.5 1.6 1.4 2.4 3.7 1.7 4.7 1.3 .14-1 .56-1.7 1-2.1-3.6-.4-7.3-1.8-7.3-7.9 0-1.7 .62-3.2 1.6-4.3-.16-.4-.72-2 .16-4.2 0 0 1.3-.42 4.4 1.6 1.3-.36 2.6-.54 4-.54 1.4 0 2.7 .18 4 .54 3.1-2.1 4.4-1.6 4.4-1.6 .88 2.2 .32 3.8 .16 4.2 1 1.1 1.6 2.5 1.6 4.3 0 6.1-3.7 7.5-7.3 7.9 .58 .5 1.1 1.5 1.1 3 0 2.1-.02 3.9-.02 4.4 0 .42 .3 .92 1.1 .76A16 16 0 0 0 32 16c0-8.8-7.2-16-16-16z" />
        </svg>
      </a>
    </header>

    <main class="container">
      <section class="card" aria-labelledby="in-h">
        <div class="card-head">
          <h2 id="in-h">Input</h2>
          <button type="button" class="link" id="exampleButton">Try an example</button>
        </div>
        <div class="field">
          <label for="path">SVG path, <code>d="…"</code> or a whole <code>&lt;svg&gt;</code> snippet</label>
          <textarea
            id="path"
            spellcheck="false"
            autocapitalize="off"
            autocomplete="off"
            placeholder="M2 12V0h7v2H4v3h5v2H4v5H2z"
          ></textarea>
        </div>
        <div class="field">
          <label for="scale">Scale</label>
          <div class="pair">
            <input value="2" id="scale" type="number" step="any" inputmode="decimal" aria-label="Scale value" />
            <input
              id="scaleSlider"
              type="range"
              min="-2"
              max="2"
              step="any"
              aria-label="Scale slider, logarithmic from 0.01 to 100"
            />
          </div>
          <div class="ticks" aria-hidden="true"><span>0.01×</span><span>0.1×</span><span>1×</span><span>10×</span><span>100×</span></div>
        </div>
        <div class="controls">
          <div class="field">
            <label for="mode">Rounding</label>
            <select id="mode">
              <option value="dec" selected>Decimals</option>
              <option value="sig">Sig. digits</option>
            </select>
          </div>
          <div class="field">
            <label for="precision">Precision: <output id="precisionOut" for="precision">3</output></label>
            <input value="3" id="precision" type="range" min="0" max="16" step="1" />
          </div>
        </div>
        <div class="switches">
          <label class="switch">
            <input type="checkbox" id="minify" checked />
            <span class="track" aria-hidden="true"></span>
            <span class="text"><b>Minify</b><small>strip zeros and separators, pack arc flags</small></span>
          </label>
          <label class="switch">
            <input type="checkbox" id="optimize" checked />
            <span class="track" aria-hidden="true"></span>
            <span class="text"><b>Optimize</b><small>H/V and S/T shorthands, shortest relative or absolute</small></span>
          </label>
        </div>
      </section>

      <section class="card output" aria-labelledby="out-h">
        <div class="card-head">
          <h2 id="out-h">Scaled output</h2>
          <span class="chip" id="stats" aria-live="polite"></span>
        </div>
        <div id="output" class="code" tabindex="0" aria-label="Scaled path data"></div>
        <p class="error" id="error" role="alert"></p>
        <button type="button" class="primary" id="copyButton">Copy</button>
      </section>

      <section class="previews" aria-label="Previews">
        <figure class="card preview">
          <svg id="svgInput" viewBox="-100 -100 200 200" role="img" aria-label="Input path preview">
            <path id="inputPath" d="" />
          </svg>
          <figcaption>Input</figcaption>
        </figure>
        <figure class="card preview">
          <svg id="svgOutput" viewBox="-100 -100 200 200" role="img" aria-label="Scaled path preview">
            <path id="outputPath" d="" />
          </svg>
          <figcaption>Scaled</figcaption>
        </figure>
      </section>
    </main>

    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
