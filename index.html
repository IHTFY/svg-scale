<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>SVG Path Scaler</title>
    <link rel="stylesheet" href="styles.css" />
    <script defer src="svgpath.js"></script>
    <script defer src="script.js"></script>

    <!-- Google Auto Ads -->
    <script
      async
      src="https://pagead2.googlesyndication.com/pagead/js/adsbygoogle.js?client=ca-pub-7816252471679024"
      crossorigin="anonymous"
    ></script>
  </head>
  <body>
    <h1 class="header">
      SVG Path Scaler<a href="https://github.com/IHTFY/svg-scale" aria-label="Source on GitHub">
        <svg id="gh_logo" height="32" width="32">
          <path
            fill="#ee6e73"
            d="M16 0C7.2 0 0 7.2 0 16c0 7.1 4.6 13 11 15 .8 .14 1.1-.34 1.1-.76 0-.38-.02-1.6-.02-3-4 .74-5.1-.98-5.4-1.9-.18-.46-.96-1.9-1.6-2.3-.56-.3-1.4-1-.02-1.1 1.3-.02 2.2 1.2 2.5 1.6 1.4 2.4 3.7 1.7 4.7 1.3 .14-1 .56-1.7 1-2.1-3.6-.4-7.3-1.8-7.3-7.9 0-1.7 .62-3.2 1.6-4.3-.16-.4-.72-2 .16-4.2 0 0 1.3-.42 4.4 1.6 1.3-.36 2.6-.54 4-.54 1.4 0 2.7 .18 4 .54 3.1-2.1 4.4-1.6 4.4-1.6 .88 2.2 .32 3.8 .16 4.2 1 1.1 1.6 2.5 1.6 4.3 0 6.1-3.7 7.5-7.3 7.9 .58 .5 1.1 1.5 1.1 3 0 2.1-.02 3.9-.02 4.4 0 .42 .3 .92 1.1 .76A16 16 0 0 0 32 16c0-8.8-7.2-16-16-16z"
          ></path>
        </svg>
      </a>
    </h1>

    <main class="container">
      <section class="cols">
        <div>
          <h2 class="header">Input</h2>
          <div class="field">
            <label for="path">SVG Path</label>
            <textarea
              id="path"
              spellcheck="false"
              placeholder="M2 12V0h7v2H4v3h5v2H4v5H2z   (or paste d=&quot;…&quot; / a full &lt;svg&gt; snippet)"
            ></textarea>
          </div>
          <div class="controls">
            <div class="field">
              <label for="scale">Scale Value</label>
              <input value="2" id="scale" type="number" step="any" />
            </div>
            <div class="field">
              <label for="mode">Rounding</label>
              <select id="mode">
                <option value="dec" selected>Decimal places</option>
                <option value="sig">Significant digits</option>
              </select>
            </div>
            <div class="field">
              <label for="precision">Precision</label>
              <input value="3" id="precision" type="number" min="0" max="16" step="1" />
            </div>
          </div>
          <label class="option">
            <input type="checkbox" id="minify" checked />
            Minify (strip zeros, separators, repeated commands, pack arc flags)
          </label>
          <label class="option">
            <input type="checkbox" id="optimize" checked />
            Optimize (H/V, S/T shorthands, shortest relative/absolute)
          </label>
        </div>

        <div>
          <h2 class="header">Scaled Output</h2>
          <div id="output"></div>
          <p class="error" id="error" role="alert"></p>
          <p class="muted" id="stats"></p>
          <button type="button" id="copyButton">Copy</button>
        </div>
      </section>

      <section class="cols">
        <svg id="svgInput" width="100%" viewBox="-100 -100 200 200" aria-label="Input path preview">
          <path id="inputPath" d="" />
        </svg>
        <svg id="svgOutput" width="100%" viewBox="-100 -100 200 200" aria-label="Scaled path preview">
          <path id="outputPath" d="" />
        </svg>
      </section>
    </main>
    <div id="toast" role="status" aria-live="polite"></div>
  </body>
</html>
